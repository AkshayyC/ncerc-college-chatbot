<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <!-- Gold Gradient for Ribbon and Inner Ring -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231F20" />
      <stop offset="100%" stop-color="#110F10" />
    </linearGradient>
  </defs>

  <!-- Outer Gear Teeth (Dark Brown/Black Wheel) -->
  <g fill="url(#darkGrad)" stroke="#D4AF37" stroke-width="1.5">
    <circle cx="150" cy="140" r="115" />
    <!-- Gear teeth shapes around circle -->
    <rect x="138" y="10" width="24" height="20" rx="3" />
    <rect x="138" y="250" width="24" height="20" rx="3" />
    <rect x="20" y="128" width="20" height="24" rx="3" />
    <rect x="260" y="128" width="20" height="24" rx="3" />
    <rect x="52" y="42" width="24" height="20" rx="3" transform="rotate(-45 64 52)" />
    <rect x="224" y="214" width="24" height="20" rx="3" transform="rotate(-45 236 224)" />
    <rect x="224" y="42" width="24" height="20" rx="3" transform="rotate(45 236 52)" />
    <rect x="52" y="214" width="24" height="20" rx="3" transform="rotate(45 64 224)" />
  </g>

  <!-- Gold Studs on Gear Teeth -->
  <g fill="url(#goldGrad)">
    <circle cx="150" cy="20" r="4" />
    <circle cx="150" cy="260" r="4" />
    <circle cx="30" cy="140" r="4" />
    <circle cx="270" cy="140" r="4" />
    <circle cx="64" cy="54" r="4" />
    <circle cx="236" cy="226" r="4" />
    <circle cx="236" cy="54" r="4" />
    <circle cx="64" cy="226" r="4" />
  </g>

  <!-- Gold Ring for Text Path -->
  <circle cx="150" cy="140" r="102" fill="none" stroke="url(#goldGrad)" stroke-width="20" />
  <circle cx="150" cy="140" r="112" fill="none" stroke="#231F20" stroke-width="2" />
  <circle cx="150" cy="140" r="92" fill="none" stroke="#231F20" stroke-width="2" />

  <!-- Circular Text Path -->
  <path id="textArcUpper" d="M 58 140 A 92 92 0 1 1 242 140" fill="none" />

  <text font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="bold" fill="#231F20" letter-spacing="0.5">
    <textPath href="#textArcUpper" startOffset="50%" text-anchor="middle">
      NEHRU COLLEGE OF ENGINEERING AND RESEARCH CENTRE
    </textPath>
  </text>

  <!-- Inner Dark Gear -->
  <circle cx="150" cy="140" r="62" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Inner Gear Teeth -->
  <g fill="url(#goldGrad)">
    <rect x="146" y="74" width="8" height="8" />
    <rect x="146" y="198" width="8" height="8" />
    <rect x="84" y="136" width="8" height="8" />
    <rect x="208" y="136" width="8" height="8" />
    <rect x="102" y="98" width="8" height="8" transform="rotate(-45 106 102)" />
    <rect x="188" y="174" width="8" height="8" transform="rotate(-45 192 178)" />
    <rect x="188" y="98" width="8" height="8" transform="rotate(45 192 102)" />
    <rect x="102" y="174" width="8" height="8" transform="rotate(45 106 178)" />
  </g>

  <!-- Center Medallion -->
  <circle cx="150" cy="140" r="42" fill="url(#goldGrad)" stroke="#231F20" stroke-width="2" />
  <circle cx="150" cy="140" r="38" fill="none" stroke="#231F20" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Shield & Academic Lamp Icon in Center -->
  <g fill="#231F20">
    <path d="M140 128 h20 v16 c0 8 -10 14 -10 14 c0 0 -10 -6 -10 -14 z" fill="none" stroke="#231F20" stroke-width="2" />
    <path d="M146 122 c2 -4 6 -4 8 -1 c2 -3 6 -3 8 1 c-3 4 -7 7 -8 11 c-1 -4 -5 -7 -8 -11 z" />
    <rect x="144" y="148" width="12" height="2" />
  </g>

  <!-- Gold Ribbon at Bottom -->
  <g>
    <!-- Ribbon Left Fold -->
    <path d="M 25 250 L 55 240 L 55 275 L 25 285 L 38 267 Z" fill="#AA7C11" stroke="#231F20" stroke-width="1.5" />
    <!-- Ribbon Right Fold -->
    <path d="M 275 250 L 245 240 L 245 275 L 275 285 L 262 267 Z" fill="#AA7C11" stroke="#231F20" stroke-width="1.5" />
    <!-- Main Ribbon Body -->
    <path d="M 45 245 Q 150 262 255 245 L 245 282 Q 150 298 55 282 Z" fill="url(#goldGrad)" stroke="#231F20" stroke-width="2" />
  </g>

  <!-- Ribbon Text: NCERC -->
  <text x="150" y="274" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="900" fill="#110F10" text-anchor="middle" letter-spacing="3">
    NCERC
  </text>
</svg>
